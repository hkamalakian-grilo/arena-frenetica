<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arena Frenética — mini-MOBA 2v2</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0d1117;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Config (todas as constantes de balanceamento + definições de mapa, data-driven) -->
<script src="src/config/balance.js"></script>
<script src="src/config/maps/mapA.js"></script>
<script src="src/config/maps/mapB.js"></script>
<script src="src/config/maps/mapC.js"></script>

<!-- Simulação (lógica pura, determinística — roda sem browser) -->
<script src="src/sim/core.js"></script>
<script src="src/sim/nav.js"></script>
<script src="src/sim/state.js"></script>
<script src="src/sim/abilities.js"></script>
<script src="src/sim/step.js"></script>
<script src="src/sim/bots.js"></script>
<script src="src/sim/headless.js"></script>

<!-- Input e render (camadas de apresentação, isoladas da simulação) -->
<script src="src/input/controls.js"></script>
<script src="src/render/effects.js"></script>
<script src="src/render/audio.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/main.js"></script>
</body>
</html>
