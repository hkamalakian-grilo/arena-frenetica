<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena Frenética">
<meta name="theme-color" content="#0d1811">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<title>Arena Frenética — mini-MOBA 2v2</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0d1811;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Config (todas as constantes de balanceamento + definições de mapa, data-driven) -->
<script src="src/config/balance.js"></script>
<script src="src/config/animations.js"></script>
<script src="src/config/maps/mapA.js"></script>
<script src="src/config/maps/mapB.js"></script>
<script src="src/config/maps/mapC.js"></script>

<!-- Simulação (lógica pura, determinística — roda sem browser) -->
<script src="src/sim/core.js"></script>
<script src="src/sim/nav.js"></script>
<script src="src/sim/state.js"></script>
<script src="src/sim/abilities.js"></script>
<script src="src/sim/abilities/brutus.js"></script>
<script src="src/sim/abilities/lyra.js"></script>
<script src="src/sim/abilities/nix.js"></script>
<script src="src/sim/abilities/sol.js"></script>
<script src="src/sim/step.js"></script>
<script src="src/sim/bots.js"></script>
<script src="src/sim/headless.js"></script>

<!-- Input e render (camadas de apresentação, isoladas da simulação) -->
<script src="src/input/controls.js"></script>
<script src="src/render/animation.js"></script>
<script src="src/render/effects.js"></script>
<script src="src/render/audio.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/main.js"></script>

<!-- App instalável + offline. Só em http(s): abrir o index.html por arquivo
     (file://) continua funcionando normalmente, apenas sem service worker. -->
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
